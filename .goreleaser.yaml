version: 2

project_name: codemri

builds:
  - id: codemri-binary
    main: ./cmd/codemri
    binary: codemri
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - windows
      - darwin
    goarch:
      - amd64
      - arm64

archives:
  - id: default
    formats:
      - tar.gz
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    format_overrides:
      - goos: windows
        formats:
          - zip

checksum:
  name_template: "checksums.txt"

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"
      - "^merge:"

release:
  github:
    owner: KangBasrengg
    name: MRI-Code
  mode: keep-existing
  replace_existing_artifacts: true
  draft: false
  prerelease: auto
  name_template: "CodeMRI {{ .Tag }}"
