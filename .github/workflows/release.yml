name: Release CodeMRI Binaries

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  goreleaser:
    name: Build & Release Cross-Platform Binaries
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go Runtime
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Verify Clean Test Suite Before Release
        run: go test -v ./...

      - name: Run GoReleaser Automated Build
        uses: goreleaser/goreleaser-action@v5
        with:
          distribution: goreleaser
          version: latest
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
